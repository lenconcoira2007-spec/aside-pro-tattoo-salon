name: Import ASIDE PRO bundle and deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import full project from uploaded ZIP
        shell: bash
        run: |
          archive="aside_pro_tattoo_salon_bundle.zip"
          if [ -f "$archive" ]; then
            mkdir -p /tmp/aside-pro-import
            unzip -q "$archive" -d /tmp/aside-pro-import
            project_dir="$(find /tmp/aside-pro-import -mindepth 1 -maxdepth 1 -type d -name 'ASIDE_PRO_Tattoo_Salon_Project' -print -quit)"
            test -n "$project_dir"
            cp .github/workflows/pages.yml /tmp/active-pages.yml
            cp -a "$project_dir/." .
            mkdir -p .github/workflows
            cp /tmp/active-pages.yml .github/workflows/pages.yml
            rm -f "$archive"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            if ! git diff --cached --quiet; then
              git commit -m "chore: import complete ASIDE PRO project bundle"
              git push origin HEAD:main
            fi
          else
            echo "No project ZIP found; continuing with current source tree."
          fi

      - name: Prepare public website files
        shell: bash
        run: |
          mkdir -p _site
          cp index.html tattoo.html piercing.html removing.html feedback.html registration.html _site/
          cp -R css JS images _site/
          mkdir -p _site/tests
          cp tests/database-demo.html tests/database-demo.js _site/tests/
          test -f _site/index.html
          test -f _site/registration.html
          test -f _site/images/tatu.svg
          test -f _site/tests/database-demo.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
